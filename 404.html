    <style>
        :root { --bg: #080a0e; --fg: #e6ebf1; --muted: #8994a3; --accent: #5fb4e0; color-scheme: dark; }
        @media (prefers-color-scheme: light) { :root { --bg: #f3f5f8; --fg: #0e141b; --muted: #4b5563; --accent: #1a6a96; color-scheme: light; } }

               font-family: 'Geist', system-ui, sans-serif; }

        .code { font-family: 'Geist Mono', monospace; color: var(--accent); font-size: .8rem; margin-bottom: 16px; }
        h1 { font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1.05; letter-spacing: -0.04em; font-weight: 560; }
        p { margin-top: 16px; color: var(--muted); line-height: 1.6; }
        a { display: inline-block; margin-top: 28px; padding: 12px 20px; border-radius: 999px; background: var(--fg); color: var(--bg);
            text-decoration: none; font-weight: 550; }
        a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
