# Static site, no real build: copy the site into dist/ (the folder Netlify publishes),
# leaving out the asset-building scripts in _tools/. (GitHub Pages skips _ folders on its own.)
[build]
  command = "mkdir -p dist && find . -maxdepth 1 ! -name . ! -name dist ! -name _tools ! -name .git -exec cp -r -t dist {} +"
  publish = "dist"
